<!doctype html>
<html lang="es" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3f4fb" />
    <meta
      name="description"
      content="Agentic Wellness AI: un agente de bienestar con IA que une nutrición, ejercicio y adherencia en un plan diario, en tu móvil y tu reloj."
    />
    <meta
      property="og:title"
      content="Agentic Wellness AI | Tu agente de bienestar con inteligencia artificial"
    />
    <meta
      property="og:description"

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Agentic Wellness AI | Tu agente de bienestar con inteligencia artificial</title>
    <script>
      try {
        const theme = localStorage.getItem("copp-theme");
        if (theme === "dark") document.documentElement.dataset.theme = theme;
        const language = localStorage.getItem("copp-language");
        if (language === "en") document.documentElement.lang = language;
      } catch {}
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
